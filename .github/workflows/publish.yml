name: Publish Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "Makefile"
      - "mise.toml"
      - "LICENSE"
      - ".dockerignore"
      - "*.md"
      - "sonar-project.properties"
      - "requirements-docs.txt"
  workflow_dispatch:
    inputs:
      allow_vulnerable_image:
        description: "Allow publishing when Trivy finds fixable HIGH or CRITICAL vulnerabilities"
        required: false
        default: false
        type: boolean

# One publish at a time, so each version-check sees the tags pushed by the
# previous run instead of racing it.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version-check:
    name: Version Check
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Released version tags are immutable: fail before building rather than
      # overwrite an image that deployments or rollbacks may already pin.
      - name: Ensure version tag is not published
        run: |
          VERSION=$(cat VERSION)
          url="https://hub.docker.com/v2/repositories/fayrus/registrator/tags/${VERSION}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$url" || true)
          case "$status" in
            404)
              echo "Image tag ${VERSION} is not published yet."
              ;;
            200)
              echo "::error::Image tag fayrus/registrator:${VERSION} is already published. Bump VERSION before merging changes that publish an image."
              exit 1
              ;;
            *)
              echo "::error::Could not confirm that fayrus/registrator:${VERSION} is unpublished (Docker Hub returned HTTP ${status}). Re-run the workflow once Docker Hub responds."
              exit 1
              ;;
          esac

  security-scan:
    name: Security Scan
    needs: version-check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for security scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fayrus/registrator:${{ steps.version.outputs.version }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: fayrus/registrator:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_vulnerable_image && '0' || '1' }}

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif

  publish:
    name: Publish
    needs: security-scan
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          {
            echo "version=$VERSION"
            echo "major=$(echo "$VERSION" | grep -oP 'v\d+')"
            echo "minor=$(echo "$VERSION" | grep -oP 'v\d+\.\d+')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: fayrus/registrator
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.authors=Fayrus https://fayr.us
            org.opencontainers.image.vendor=Fayrus
            org.opencontainers.image.base.name=cgr.dev/chainguard/static:latest
            dev.chainguard.image.title=
            dev.chainguard.package.main=

      - name: Build and push
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create git tag
        id: git_tag
        run: |
          VERSION=$(cat VERSION)
          if ! git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Docker Hub description
        id: dockerhub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: fayrus/registrator
          readme-filepath: ./.github/DOCKERHUB.md
          short-description: "Registers Docker containers in Consul, etcd, CoreDNS, or ZooKeeper automatically"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Publish summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Job status | ${{ job.status }} |"
            echo "| Version | ${{ steps.version.outputs.version }} |"
            echo "| Major tag | ${{ steps.version.outputs.major }} |"
            echo "| Minor tag | ${{ steps.version.outputs.minor }} |"
            echo "| Image | fayrus/registrator |"
            echo "| Published tags | latest, ${{ steps.version.outputs.version }}, ${{ steps.version.outputs.minor }}, ${{ steps.version.outputs.major }} |"
            echo "| Image digest | ${{ steps.publish.outputs.digest }} |"
            echo "| Git tag created | ${{ steps.git_tag.outputs.created }} |"
            echo "| Docker Hub description update | ${{ steps.dockerhub.outcome }} |"
            echo "| Vulnerable image override | ${{ github.event_name == 'workflow_dispatch' && inputs.allow_vulnerable_image || false }} |"
          } >> "$GITHUB_STEP_SUMMARY"
