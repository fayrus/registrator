name: 🔐 Vulnerability Check

# Runs on every PR and daily on main, so vulnerabilities disclosed after a
# release are reported without waiting for a code change. Scans code, modules,
# and the Go standard library for the version pinned in mise.toml.
#
# No paths filter on pull_request: Vulncheck (Go) is a required check, and a
# workflow skipped by a path filter never reports it. The `changes` job skips
# the scan on PRs that do not touch Go code, modules, or the toolchain pin;
# a skipped job satisfies the required check.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔎 Detect Go changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed"
          relevant='(\.go$|^go\.(mod|sum)$|^mise\.toml$|^\.github/workflows/vulncheck\.yml$)'
          if printf '%s\n' "$changed" | grep -qE "$relevant"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  vulncheck:
    name: Vulncheck (Go)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🐹 Set up toolchain
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.12
          install_args: go go:golang.org/x/vuln/cmd/govulncheck

      - name: 🔐 Check for known vulnerabilities
        run: mise run vulncheck
