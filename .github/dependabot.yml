version: 2
updates:
  # Go module updates trigger an image publish on merge: apply them together
  # with a VERSION/CHANGELOG bump instead of merging the PR as-is.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # Base image updates change the published image: apply them together with a
  # VERSION/CHANGELOG bump, same as Go module updates.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    ignore:
      # The golang image must match the go directive in go.mod; minor and
      # major Go upgrades are done deliberately with the dependency-upgrade pass.
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # docs/requirements.txt is generated by pip-compile from docs/requirements.in.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      docs-minor-patch:
        update-types: [minor, patch]
