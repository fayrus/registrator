version: 2
updates:
  # Go module updates trigger an image publish on merge: apply them together
  # with a VERSION/CHANGELOG bump instead of merging the PR as-is.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # docs/requirements.txt is generated by pip-compile from docs/requirements.in.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs:
        patterns:
          - "*"
